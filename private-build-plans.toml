[buildPlans.pragsq]
family = "Pragsq"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = true

hintParams = ["-a", "qqq"]

    [buildPlans.pragsq.widths.normal]
    shape = 500
    menu  = 5
    css   = "normal"

    [buildPlans.pragsq.metricOverride]
    leading = 1100
    xHeight = 550

    [buildPlans.pragsq.ligations]
    inherits="default-calt"
    enables = [
        "eqslasheq",
        "kern-dotty",
        "kern-bars",
        "llggeq",
         "--fast-chaining--"
    ]
    disables = ["slash-asterisk"]

    [buildPlans.pragsq.variants]
    inherits = "ss08"

        [buildPlans.pragsq.variants.design]
        tittle = "square"
        punctuation-dot = "square"
        braille-dot = "square"
        at = "threefold-solid-inner"

    [buildPlans.pragsq.weights.regular]
    shape = 425
    menu = 400
    css = 400

    [buildPlans.pragsq.weights.semibold]
    shape = 600
    menu = 600
    css = 600

    [buildPlans.pragsq.weights.bold]
    shape = 800
    menu = 700
    css = 700

    [buildPlans.pragsq.weights.black]
    shape = 900
    menu = 900
    css = 900

    [buildPlans.pragsq.slopes]
    upright = "default.Upright"
    italic = "default.Italic"
